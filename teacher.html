<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restroom Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<link rel="icon" href="assets/edep-logo.png">
<style>
  body { font-size: 16px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 30px; margin: 0 0 16px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 700; }
  input, select { padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--sky); outline-offset: -1px; }
  input[type=date]::-webkit-calendar-picker-indicator { filter: invert(.8); }
  button { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
  button:hover { border-color: var(--sky); }
  button.primary { background: var(--sky); border-color: var(--sky); color: var(--accent-ink); font-weight: 700; }
  .link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; }
  .login { max-width: 400px; margin: 10vh auto 0; background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 28px; }
  .login img { height: 56px; margin-bottom: 20px; }
  .login form { display: grid; gap: 12px; }
  .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 20px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .filters label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .day { display: flex; gap: 6px; }
  .day button { padding: 10px 12px; }
  .filters .student { flex: 1 1 220px; }
  .filters .student select { width: 100%; }
  .filters .end { margin-left: auto; display: flex; gap: 8px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat b { display: block; font-size: 28px; font-variant-numeric: tabular-nums; color: var(--sky); }
  .stat span { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } .filters .end { margin-left: 0; } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 13px; color: var(--muted); font-weight: 700; }
  td.email { color: var(--muted); font-size: 14px; }
  tr:last-child td { border-bottom: 0; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft);
    color: var(--sky); font-size: 13px; font-weight: 700; }
  .pill.denied { background: var(--danger-soft); color: var(--danger-text); }
  .stat.denied b { color: var(--danger-text); }
  tr.denied td { background: rgb(229 72 77 / .06); }
  td.status { color: var(--muted); font-size: 14px; }
  #top td:first-child { white-space: normal; }
  .studentlink { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
  .studentlink:hover { text-decoration: underline; color: var(--sky); }
  .range { color: var(--muted); margin: -8px 0 16px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="brand" id="brand" hidden><img src="assets/edep-logo-light.png" alt="Edep Academy">
    <span class="tag">Restroom Log · <button class="link" id="logout">Lock</button></span></div>
  <div id="app"></div>
</main>
<script src="config.js"></script>
<script>
const app = document.getElementById("app");
const brand = document.getElementById("brand");
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const parseDay = s => new Date(`${s}T00:00:00`);
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} },
};
let code = store.get("teacher_code");
let roster = [];
let rows = [];
let refreshTimer;

$("logout").onclick = () => { code = null; store.set("teacher_code", null); showLogin(); };

function showLogin(msg = "") {
  clearInterval(refreshTimer);
  brand.hidden = true;
  app.innerHTML = `
    <div class="login">
      <img src="assets/edep-logo-light.png" alt="Edep Academy">
      <h1>Restroom Log</h1>
      <form id="f">
        <label for="c" class="muted">Teacher code</label>
        <input id="c" type="password" autocomplete="current-password" required autofocus>
        <button class="primary">Open log</button>
        <p class="err" role="alert">${esc(msg)}</p>
      </form>
    </div>`;
  $("f").onsubmit = async e => {
    e.preventDefault();
    const c = $("c").value;
    try {
      if (!(await db.rpc("toilet_check_code", { p_code: c }))) return showLogin("That code is not right.");
      code = c; store.set("teacher_code", c); showDashboard();
    } catch (err) { showLogin(err.message); }
  };
}

async function showDashboard() {
  roster = await db.select("toilet_students?select=email,name,class_name&order=name");
  const classes = [...new Set(roster.map(r => r.class_name))].sort();
  brand.hidden = false;
  app.innerHTML = `
    <div class="filters">
      <label>Day
        <span class="day">
          <button id="prev" aria-label="Previous day">‹</button>
          <input type="date" id="day" value="${ymd(new Date())}">
          <button id="next" aria-label="Next day">›</button>
          <button id="today">Today</button>
        </span>
      </label>
      <label>Show
        <select id="period">
          <option value="day">That day</option>
          <option value="week">That week</option>
          <option value="month">That month</option>
          <option value="all">All time</option>
        </select>
      </label>
      <label>Class<select id="cls"><option value="">All classes</option>${classes.map(c => `<option>${esc(c)}</option>`).join("")}</select></label>
      <label class="student">Student<select id="student"></select></label>
      <label>Status
        <select id="status">
          <option value="">Sign-ins and denied</option>
          <option value="allowed">Sign-ins only</option>
          <option value="denied">Denied only</option>
        </select>
      </label>
      <span class="end"><button id="clear">Clear filters</button><button id="csv">Download CSV</button></span>
    </div>
    <p class="range" id="range"></p>
    <div class="stats" id="stats"></div>
    <div class="grid">
      <section class="panel"><h2>Sign-ins</h2><div id="table"></div></section>
      <section class="panel"><h2>Most frequent</h2><div id="top"></div></section>
    </div>`;

  fillStudents();
  $("day").addEventListener("change", load);
  $("period").addEventListener("change", load);
  $("cls").addEventListener("change", () => { fillStudents(); load(); });
  $("student").addEventListener("change", render);
  $("status").addEventListener("change", render);
  $("prev").onclick = () => shiftDay(-1);
  $("next").onclick = () => shiftDay(1);
  $("today").onclick = () => { $("day").value = ymd(new Date()); $("period").value = "day"; load(); };
  $("clear").onclick = () => {
    $("day").value = ymd(new Date()); $("period").value = "day"; $("cls").value = ""; $("student").value = ""; $("status").value = "";
    fillStudents(); load();
  };
  $("csv").onclick = downloadCsv;
  $("top").addEventListener("click", e => {
    const b = e.target.closest("[data-email]");
    if (b) { $("student").value = b.dataset.email; render(); }
  });
  await load();
  refreshTimer = setInterval(load, 30000);
}

function fillStudents() {
  const cls = $("cls").value;
  const keep = $("student").value;
  const list = roster.filter(s => !cls || s.class_name === cls);
  $("student").innerHTML = `<option value="">All students</option>` + list.map(s =>
    `<option value="${esc(s.email)}">${esc(s.name)}${cls ? "" : ` (${esc(s.class_name)})`}</option>`).join("");
  if (list.some(s => s.email === keep)) $("student").value = keep;
}

function shiftDay(n) {
  const d = parseDay($("day").value || ymd(new Date()));
  const p = $("period").value;
  if (p === "week") d.setDate(d.getDate() + 7 * n);
  else if (p === "month") d.setMonth(d.getMonth() + n);
  else d.setDate(d.getDate() + n);
  $("day").value = ymd(d);
  if (p === "all") $("period").value = "day";
  load();
}

function currentRange() {
  const d = parseDay($("day").value || ymd(new Date()));
  const p = $("period").value;
  let start = new Date(d), end;
  if (p === "week") { start.setDate(d.getDate() - ((d.getDay() + 6) % 7)); end = new Date(start); end.setDate(start.getDate() + 7); }
  else if (p === "month") { start = new Date(d.getFullYear(), d.getMonth(), 1); end = new Date(d.getFullYear(), d.getMonth() + 1, 1); }
  else if (p === "all") { start = new Date(2000, 0, 1); end = new Date(2100, 0, 1); }
  else { end = new Date(d); end.setDate(d.getDate() + 1); }
  return { start, end, p };
}

function rangeLabel({ start, end, p }) {
  const opt = { weekday: "short", month: "short", day: "numeric", year: "numeric" };
  if (p === "all") return "All time";
  if (p === "month") return start.toLocaleDateString([], { month: "long", year: "numeric" });
  if (p === "week") { const last = new Date(end); last.setDate(end.getDate() - 1);
    return `Week of ${start.toLocaleDateString([], opt)} – ${last.toLocaleDateString([], opt)}`; }
  return start.toLocaleDateString([], { ...opt, weekday: "long" });
}

async function load() {
  const range = currentRange();
  try {
    rows = await db.rpc("toilet_teacher_signins", {
      p_code: code, p_from: range.start.toISOString(), p_to: range.end.toISOString(),
      p_class: $("cls").value || null,
    });
    $("range").textContent = rangeLabel(range);
    render();
  } catch (err) {
    if (/teacher code/i.test(err.message)) return showLogin("Teacher code changed. Enter the new one.");
    $("table").innerHTML = `<p class="err">Couldn't load: ${esc(err.message)}</p>`;
  }
}

function filtered() {
  const email = $("student").value;
  const status = $("status").value;
  return rows.filter(r => (!email || r.student_email === email)
    && (!status || (status === "denied") !== r.allowed));
}

function render() {
  const list = filtered();
  const oneDay = $("period").value === "day";
  const fmt = d => new Date(d).toLocaleString([], oneDay
    ? { hour: "numeric", minute: "2-digit" }
    : { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

  const byStudent = new Map();
  rows.forEach(r => {
    const s = byStudent.get(r.student_email) || { name: r.student_name, email: r.student_email, cls: r.class_name, n: 0, denied: 0 };
    if (r.allowed) s.n++; else s.denied++;
    byStudent.set(r.student_email, s);
  });
  const top = [...byStudent.values()].sort((a, b) => b.n - a.n || b.denied - a.denied || a.name.localeCompare(b.name));
  const signins = list.filter(r => r.allowed);
  const denied = list.length - signins.length;
  const days = new Set(signins.map(r => ymd(new Date(r.signed_at)))).size;
  const studentsInView = new Set(list.map(r => r.student_email)).size;

  $("stats").innerHTML = `
    <div class="stat"><b>${signins.length}</b><span>${signins.length === 1 ? "sign-in" : "sign-ins"}</span></div>
    <div class="stat denied"><b>${denied}</b><span>${denied === 1 ? "denied attempt" : "denied attempts"} (3-hour rule)</span></div>
    <div class="stat"><b>${studentsInView}</b><span>${studentsInView === 1 ? "student" : "different students"}</span></div>
    <div class="stat"><b>${days}</b><span>${days === 1 ? "day with sign-ins" : "days with sign-ins"}</span></div>`;

  $("table").innerHTML = list.length ? `
    <table><thead><tr><th>${oneDay ? "Time" : "When"}</th><th>Student</th><th>Class</th><th>Status</th><th>Email</th></tr></thead>
    <tbody>${list.map(r => `<tr${r.allowed ? "" : ` class="denied"`}><td>${fmt(r.signed_at)}</td><td>${esc(r.student_name)}</td>
      <td><span class="pill">${esc(r.class_name)}</span></td>
      <td class="status">${r.allowed ? "Signed in" : `<span class="pill denied">Denied</span>`}</td>
      <td class="email">${esc(r.student_email)}</td></tr>`).join("")}</tbody></table>`
    : `<p class="muted">No sign-ins for these filters.</p>`;

  $("top").innerHTML = top.length ? `
    <table><tbody>${top.slice(0, 15).map(s => `<tr>
      <td><button class="studentlink" data-email="${esc(s.email)}">${esc(s.name)}</button></td>
      <td><span class="pill">${esc(s.cls)}</span></td>
      <td>${s.n}×${s.denied ? ` <span class="pill denied">${s.denied} denied</span>` : ""}</td></tr>`).join("")}</tbody></table>`
    : `<p class="muted">Nothing yet.</p>`;
}

function downloadCsv() {
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const lines = [["Date", "Time", "Student", "Email", "Class", "Status"].join(",")].concat(filtered().map(r => {
    const d = new Date(r.signed_at);
    return [ymd(d), d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }), r.student_name, r.student_email, r.class_name,
      r.allowed ? "Signed in" : "Denied"].map(q).join(",");
  }));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv" }));
  a.download = `restroom-log-${$("period").value}-${$("day").value}.csv`;
  a.click();
}

code ? showDashboard().catch(e => showLogin(e.message)) : showLogin();
</script>
</body>
</html>
