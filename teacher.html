<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restroom Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea; --surface: #fffdf8; --ink: #1d2321; --muted: #5d6662;
    --line: #ddd6c8; --accent: #1f6f5c; --accent-ink: #fff; --accent-soft: #dcebe5; --warn: #9a5b12;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121614; --surface: #1b201e; --ink: #ecefe9; --muted: #a2aba6;
      --line: #2e3633; --accent: #4fb596; --accent-ink: #0b1411; --accent-soft: #1d3a31; --warn: #e0a65a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Atkinson Hyperlegible", system-ui, sans-serif; font-size: 16px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 30px; margin: 0 0 16px; }
  h2 { font-size: 16px; margin: 0 0 10px; color: var(--muted); font-weight: 700; }
  button, input, select { font: inherit; color: var(--ink); }
  input, select { padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; }
  .login { max-width: 380px; margin: 12vh auto 0; background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 28px; }
  .login form { display: grid; gap: 12px; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 20px; }
  .filters label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .filters .grow { flex: 1 1 220px; }
  .filters .grow input { width: 100%; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat b { display: block; font-size: 28px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 13px; color: var(--muted); font-weight: 700; }
  td.email { color: var(--muted); font-size: 14px; }
  tr:last-child td { border-bottom: 0; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); font-size: 13px; font-weight: 700; }
  .muted { color: var(--muted); }
  .err { color: var(--warn); }
  .studentlink { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
  .studentlink:hover { text-decoration: underline; }
</style>
</head>
<body>
<main id="app"></main>
<script src="config.js"></script>
<script>
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fold = s => s.toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ı/g, "i");
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} },
};
let code = store.get("teacher_code");
let rows = [];
let refreshTimer;

function showLogin(msg = "") {
  clearInterval(refreshTimer);
  app.innerHTML = `
    <div class="login">
      <h1>Restroom Log</h1>
      <form id="f">
        <label for="c" class="muted">Teacher code</label>
        <input id="c" type="password" autocomplete="current-password" required autofocus>
        <button class="primary">Open log</button>
        <p class="err" role="alert">${esc(msg)}</p>
      </form>
    </div>`;
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const c = document.getElementById("c").value;
    try {
      if (!(await db.rpc("toilet_check_code", { p_code: c }))) return showLogin("That code is not right.");
      code = c; store.set("teacher_code", c); showDashboard();
    } catch (err) { showLogin(err.message); }
  };
}

async function showDashboard() {
  const classes = [...new Set((await db.select("toilet_students?select=class_name")).map(r => r.class_name))].sort();
  const today = ymd(new Date());
  app.innerHTML = `
    <header><h1>Restroom Log</h1><button class="link" id="logout">Lock</button></header>
    <div class="filters">
      <label>From<input type="date" id="from" value="${today}"></label>
      <label>To<input type="date" id="to" value="${today}"></label>
      <label>Class<select id="cls"><option value="">All classes</option>${classes.map(c => `<option>${esc(c)}</option>`).join("")}</select></label>
      <label class="grow">Student<input type="search" id="q" placeholder="Name or email"></label>
      <button id="csv">Download CSV</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="grid">
      <section class="panel"><h2>Sign-ins</h2><div id="table"></div></section>
      <section class="panel"><h2>Most frequent</h2><div id="top"></div></section>
    </div>`;
  document.getElementById("logout").onclick = () => { code = null; store.set("teacher_code", null); showLogin(); };
  ["from", "to", "cls"].forEach(id => document.getElementById(id).addEventListener("change", load));
  document.getElementById("q").addEventListener("input", render);
  document.getElementById("csv").onclick = downloadCsv;
  document.getElementById("top").addEventListener("click", e => {
    const b = e.target.closest("[data-email]");
    if (b) { document.getElementById("q").value = b.dataset.email; render(); }
  });
  await load();
  refreshTimer = setInterval(load, 30000);
}

async function load() {
  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;
  const start = new Date(`${from}T00:00:00`);
  const end = new Date(`${to}T00:00:00`); end.setDate(end.getDate() + 1);
  try {
    rows = await db.rpc("toilet_teacher_signins", {
      p_code: code, p_from: start.toISOString(), p_to: end.toISOString(),
      p_class: document.getElementById("cls").value || null,
    });
    render();
  } catch (err) {
    if (/teacher code/i.test(err.message)) return showLogin("Teacher code changed. Enter the new one.");
    document.getElementById("table").innerHTML = `<p class="err">Couldn't load: ${esc(err.message)}</p>`;
  }
}

function filtered() {
  const term = fold(document.getElementById("q").value.trim());
  return term ? rows.filter(r => fold(r.student_name).includes(term) || r.student_email.includes(term)) : rows;
}

function render() {
  const list = filtered();
  const multiDay = document.getElementById("from").value !== document.getElementById("to").value;
  const fmt = d => new Date(d).toLocaleString([], multiDay
    ? { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }
    : { hour: "numeric", minute: "2-digit" });

  const byStudent = new Map();
  list.forEach(r => {
    const s = byStudent.get(r.student_email) || { name: r.student_name, email: r.student_email, cls: r.class_name, n: 0 };
    s.n++; byStudent.set(r.student_email, s);
  });
  const top = [...byStudent.values()].sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
  const lastHour = list.filter(r => Date.now() - new Date(r.signed_at) < 3600e3).length;

  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${list.length}</b><span>sign-ins</span></div>
    <div class="stat"><b>${byStudent.size}</b><span>different students</span></div>
    <div class="stat"><b>${lastHour}</b><span>in the last hour</span></div>`;

  document.getElementById("table").innerHTML = list.length ? `
    <table><thead><tr><th>${multiDay ? "When" : "Time"}</th><th>Student</th><th>Class</th><th>Email</th></tr></thead>
    <tbody>${list.map(r => `<tr><td>${fmt(r.signed_at)}</td><td>${esc(r.student_name)}</td>
      <td><span class="pill">${esc(r.class_name)}</span></td><td class="email">${esc(r.student_email)}</td></tr>`).join("")}</tbody></table>`
    : `<p class="muted">No sign-ins for these filters.</p>`;

  document.getElementById("top").innerHTML = top.length ? `
    <table><tbody>${top.slice(0, 15).map(s => `<tr>
      <td><button class="studentlink" data-email="${esc(s.email)}">${esc(s.name)}</button></td>
      <td><span class="pill">${esc(s.cls)}</span></td><td>${s.n}×</td></tr>`).join("")}</tbody></table>`
    : `<p class="muted">Nothing yet.</p>`;
}

function downloadCsv() {
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const lines = [["Date", "Time", "Student", "Email", "Class"].join(",")].concat(filtered().map(r => {
    const d = new Date(r.signed_at);
    return [ymd(d), d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }), r.student_name, r.student_email, r.class_name].map(q).join(",");
  }));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv" }));
  a.download = `restroom-log-${document.getElementById("from").value}_to_${document.getElementById("to").value}.csv`;
  a.click();
}

code ? showDashboard().catch(e => showLogin(e.message)) : showLogin();
</script>
</body>
</html>
